name: MIMO_NDI_BUILD
on:
  push:
    branches: [ "main", "master", "fix/stream-lifecycle-20261019" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Flutter source and tests
        # Existing lint warnings remain visible; all analysis errors are fatal.
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
      - name: Flutter lifecycle regression tests
        run: flutter test --no-pub
      - name: Native production scheduling regression tests
        run: |
          swiftc ios/Runner/StreamScheduling.swift tests/native/StreamSchedulingTests.swift -o /tmp/mimo-stream-tests
          /tmp/mimo-stream-tests
      - name: Existing OMT protocol simulations
        run: python3 test_omt_protocol.py

  build_ios:
    needs: validate
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Backup_iOS_Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          cp -r ios/Runner ios/Runner.bak

      - name: Create_Project
        run: flutter create --project-name=mimo_ndi --platforms=ios .

      - name: Restore_iOS_Files
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          cp -r lib.bak/. lib/
          cp -r ios/Runner.bak/. ios/Runner/

      - name: Fetch_NDI
        run: |
          brew install p7zip
          mkdir -p ios/NDISDK/lib/
          mkdir -p ios/NDISDK/include/
          cd ios
          curl -L "https://github.com/djenadimohamedamine-code/MIMO_IOS/releases/download/v1.0.1-stable/libndi_ios.zip" -o "libndi_ios.zip"
          curl -L "https://github.com/djenadimohamedamine-code/MIMO_IOS/releases/download/v1.0.1-stable/include.7z" -o "include.7z"
          unzip -o libndi_ios.zip -d temp_lib
          find temp_lib -name "*.a" -exec cp {} NDISDK/lib/libndi_ios.a \;
          7z x include.7z -oNDISDK/include/ -y

      - name: Deps
        run: |
          flutter config --enable-ios
          flutter clean
          flutter pub get

      - name: Xcode_Config
        run: |
          sudo gem install xcodeproj
          cd ios
          ruby configure_xcode.rb

      - name: Pods
        run: |
          cd ios
          for i in 1 2 3 4 5; do
            echo "Tentative $i pour pod install..."
            pod install --repo-update && break || sleep 15
          done

      - name: Build_iOS
        run: |
          flutter build ios --release --no-codesign --verbose \
            --dart-define=FLUTTER_XCODE_SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            --dart-define=MIMO_BUILD_SHA=${{ github.sha }}
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r MIMO_NDI.ipa Payload
          git rev-parse HEAD > build-commit.txt

      - name: Upload_iOS
        uses: actions/upload-artifact@v4
        with:
          name: mimo-ndi-ipa-${{ github.sha }}
          path: |
            build/ios/iphoneos/MIMO_NDI.ipa
            build/ios/iphoneos/build-commit.txt

  build_android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup_Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Backup_Android_Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib.bak
          cp -r android/app/src/main android/app/src/main.bak
          cp -r android/gradle/wrapper android/gradle/wrapper.bak
          cp android/app/build.gradle android/app/build.gradle.bak
          cp android/build.gradle android/build.gradle.bak
          cp android/settings.gradle android/settings.gradle.bak

      - name: Create_Project
        run: flutter create --project-name=mimo_ndi --platforms=android .

      - name: Restore_Android_Files
        run: |
          cp pubspec.yaml.bak pubspec.yaml
          cp -r lib.bak/. lib/
          cp -r android/app/src/main.bak/. android/app/src/main/
          cp -r android/gradle/wrapper.bak/. android/gradle/wrapper/
          cp android/app/build.gradle.bak android/app/build.gradle
          cp android/build.gradle.bak android/build.gradle
          cp android/settings.gradle.bak android/settings.gradle

      - name: Deps
        run: |
          flutter config --enable-android
          flutter clean
          flutter pub get

      - name: Build_Android
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload_Android
        uses: actions/upload-artifact@v4
        with:
          name: mimo-ndi-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
